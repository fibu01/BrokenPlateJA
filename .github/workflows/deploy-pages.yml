name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /BrokenPlateJA
      NEXT_PUBLIC_SITE_URL: https://fibu01.github.io/BrokenPlateJA
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static website
        run: npm run build
      - name: Prepare GitHub Pages artifact
        run: |
          touch dist/client/.nojekyll
          find dist/client -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.rsc' \) -print0 | xargs -0 sed -i \
            -e 's|url(/fonts/|url(/BrokenPlateJA/fonts/|g' \
            -e 's|url("/fonts/|url("/BrokenPlateJA/fonts/|g' \
            -e 's|"/_next/|"/BrokenPlateJA/_next/|g'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
